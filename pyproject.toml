[build-system]
requires = ["uv_build==0.10.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "parkinsons_ml"

[project]
name = "parkinsons-telemonitoring"
version = "0.1.0"
description = "Reproducible Parkinson's motor UPDRS prediction with experiment tracking and drift monitoring"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dvc==3.67.1",
    "evidently==0.7.23",
    "fastapi==0.162.7",
    "httpx==0.28.1",
    "mlflow==3.18.0",
    "numpy==2.5.4",
    # Evidently 0.7.23 imports pandas internals removed in pandas 3.
    "pandas==2.3.3",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "sqlalchemy==2.1.8",
    "streamlit==1.67.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "coverage==7.17.3",
    "flake8==7.5.0",
    "ipykernel>=7.4.0",
    "nbdime==4.0.4",
    "nbstripout==0.9.1",
    "pre-commit==4.7.0",
    "pre-commit-hooks==6.0.0",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["src", "tests"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
