name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.9"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Check lockfile consistency
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Check dependency compatibility
        run: uv pip check --python .venv/bin/python

      - name: Check requirements export
        run: |
          uv export --frozen --all-groups --no-hashes --no-emit-project --output-file requirements.txt > /dev/null
          git diff --exit-code -- requirements.txt

      - name: Run pre-commit hooks
        run: uv run --frozen pre-commit run --all-files

      # Tests generate their own datasets and launch temporary localhost MLflow
      # servers. No DVC remote, development service, or project secrets are needed.
      - name: Run tests and coverage
        run: uv run --frozen pytest
